<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f80c4"/>
      <stop offset="0.55" stop-color="#1f5f93"/>
      <stop offset="1" stop-color="#143b58"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e4c3"/>
      <stop offset="1" stop-color="#d8b98a"/>
    </linearGradient>
    <linearGradient id="soil2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d3a6"/>
      <stop offset="1" stop-color="#c9a271"/>
    </linearGradient>
    <clipPath id="soilClip">
      <path d="M150 470 L430 470 L720 820 L894 820 L894 900 L150 900 Z"/>
    </clipPath>
  </defs>

  <!-- rounded app tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="208" fill="url(#bg)"/>

  <!-- faint grid, engineering feel -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
    <path d="M150 240 H894 M150 350 H894 M150 460 H894 M150 570 H894 M150 680 H894 M150 790 H894"/>
    <path d="M260 150 V900 M400 150 V900 M540 150 V900 M680 150 V900 M820 150 V900"/>
  </g>

  <!-- soil mass (layered) -->
  <g clip-path="url(#soilClip)">
    <rect x="150" y="470" width="744" height="430" fill="url(#soil)"/>
    <rect x="150" y="700" width="744" height="200" fill="url(#soil2)"/>
    <path d="M150 700 L894 700" stroke="#b7915f" stroke-width="5" stroke-opacity="0.55"/>
    <path d="M150 790 L894 790" stroke="#b7915f" stroke-width="4" stroke-opacity="0.4"/>
  </g>
  <!-- ground surface line -->
  <path d="M150 470 L430 470 L720 820 L894 820" fill="none" stroke="#5b4a2e" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- critical slip circle arc -->
  <path d="M320 470 A 470 470 0 0 1 735 812" fill="none" stroke="#ff6a4d" stroke-width="18" stroke-linecap="round"/>
  <!-- slice ticks along the arc -->
  <g stroke="#ff6a4d" stroke-opacity="0.5" stroke-width="7">
    <path d="M380 487 L372 450"/>
    <path d="M470 516 L462 479"/>
    <path d="M560 560 L554 522"/>
    <path d="M640 620 L636 582"/>
    <path d="M700 700 L700 662"/>
  </g>
  <!-- circle centre marker -->
  <circle cx="590" cy="352" r="16" fill="#ffd24a"/>

  <!-- phreatic / flow line -->
  <path d="M150 560 Q430 548 640 650 T894 720" fill="none" stroke="#8fd3ff" stroke-width="9" stroke-dasharray="4 26" stroke-linecap="round" stroke-opacity="0.9"/>
</svg>
